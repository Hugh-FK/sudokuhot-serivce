# Nightly D1 export -> R2 (bucket: sudokuhot, prefix: d1-backups/)
#
# GitHub: Settings -> Environments -> production -> Environment secrets:
#   CLOUDFLARE_API_TOKEN  (D1 Edit + R2 Object Read & Write)
#   CLOUDFLARE_ACCOUNT_ID

name: D1 backup to R2

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing environment secret CLOUDFLARE_API_TOKEN (Settings -> Environments -> production)"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing environment secret CLOUDFLARE_ACCOUNT_ID (Settings -> Environments -> production)"
            exit 1
          fi
          echo "Cloudflare secrets are configured."

      - name: Export D1 and upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/d1-backup-to-r2.sh
