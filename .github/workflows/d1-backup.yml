# Nightly D1 export -> R2 (bucket: sudokuhot, prefix: d1-backups/)
#
# GitHub: Settings -> Environments -> production -> Environment secrets:
#   CLOUDFLARE_API_TOKEN  (D1 Edit + R2 Object Read & Write)
#   CLOUDFLARE_ACCOUNT_ID

name: D1 backup to R2

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare token and D1 permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_ID="326f88af-40a1-4b42-bca6-33624c15b5ed"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing environment secret CLOUDFLARE_API_TOKEN (Settings -> Environments -> production)"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing environment secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          echo "Token prefix: ${CLOUDFLARE_API_TOKEN:0:5}..."
          if [[ "$CLOUDFLARE_API_TOKEN" == cfat_* ]]; then
            echo "::error::Token looks like an R2 token (cfat_*). Create a User API Token at dash.cloudflare.com/profile/api-tokens instead."
            exit 1
          fi

          echo "Verifying API token..."
          curl -sf "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null

          echo "Checking D1 database access for account ${CLOUDFLARE_ACCOUNT_ID}..."
          HTTP=$(curl -s -o /tmp/d1-get.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "GET /d1/database HTTP: $HTTP"
          if [ "$HTTP" = "404" ]; then
            cat /tmp/d1-get.json
            echo "::error::Database not found — CLOUDFLARE_ACCOUNT_ID is likely wrong. Use account ai: fd0d26d243e60ffc3c81b54439862fd9"
            exit 1
          fi
          if [ "$HTTP" != "200" ]; then
            cat /tmp/d1-get.json
            echo "::error::Token cannot read D1. Add Account -> D1 -> Edit on account ai."
            exit 1
          fi

          echo "Cloudflare credentials OK (D1 export requires Account -> D1 -> Edit, not Read only)."

      - name: Export D1 and upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Job Summary appears on the Actions run page (no need to expand logs).
          echo "## D1 Backup run" >> "$GITHUB_STEP_SUMMARY"
          echo "Started at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/d1-backup-to-r2.sh
