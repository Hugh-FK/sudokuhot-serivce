main = "src/index.ts"
name = "sudokuhot-serivce"
compatibility_date = "2025-06-01"

# 线上变量（deploy 生效）。本地 wrangler dev 由 .dev.vars 覆盖
[vars]
APP_ENV = "production"
APP_NAME = "Sudoku Hot API"
APP_VERSION = "1.0.0"
API_PUBLIC_URL = "https://api.sudokuhot.com"
FRONTEND_URL = "https://www.sudokuhot.com"
ALLOWED_ORIGINS = "https://sudokuhot.com,https://www.sudokuhot.com,http://sudokuhot.com,http://www.sudokuhot.com"

[[d1_databases]]
binding = "DB"
database_name = "sudokuhot-db"
database_id = "326f88af-40a1-4b42-bca6-33624c15b5ed"
migrations_dir = "migrations"

[observability.logs]
enabled = false
invocation_logs = true
